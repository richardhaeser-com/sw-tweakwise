name: Testing code

on: [push, pull_request]

jobs:
  static:
    name: Static analysis
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        php: ['8.2', '8.3', '8.4']
        experimental: [false]
        dependencies: ['lowest', 'highest']

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP Version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          ini-values: post_max_size=256M, max_execution_time=180

      - name: Update Composer
        run: |
          sudo composer self-update
          composer --version
          composer config --no-plugins allow-plugins.symfony/runtime true

      - name: Install lowest dependencies with composer
        if: matrix.dependencies == 'lowest'
        run: composer update --no-ansi --no-interaction --no-progress --prefer-lowest

      - name: Install highest dependencies with composer
        if: matrix.dependencies == 'highest'
        run: composer update --no-ansi --no-interaction --no-progress

      - name: PHPStan
        run: |
          php -d memory_limit=-1 vendor/bin/phpstan analyse --configuration phpstan.neon --debug

      - name: CGL
        if: matrix.dependencies == 'highest' && matrix.php == '8.3'
        run: |
          php -d memory_limit=-1 vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --using-cache=no --diff

      - name: PHP linting
        run: |
          php -d memory_limit=-1 vendor/bin/phplint --configuration=.phplint.yml

  unit:
    needs: static
    name: Unit tests (PHP ${{ matrix.php }}, SW ${{ matrix.shopware-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            shopware-version: '6.5.8.19'
          - php: '8.3'
            shopware-version: '6.5.8.19'
          - php: '8.2'
            shopware-version: '6.6.10.21'
          - php: '8.3'
            shopware-version: '6.6.10.21'
          - php: '8.4'
            shopware-version: '6.6.10.21'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: pcov

      - name: Pin Shopware packages to ${{ matrix.shopware-version }}
        run: |
          composer require --no-update --no-interaction \
            "shopware/core:${{ matrix.shopware-version }}" \
            "shopware/administration:${{ matrix.shopware-version }}" \
            "shopware/storefront:${{ matrix.shopware-version }}"

      - name: Install dependencies
        run: composer update --no-ansi --no-interaction --no-progress

      - name: Run unit tests
        run: |
          php -d pcov.enabled=1 vendor/bin/phpunit --configuration phpunit.unit.xml --log-junit junit-unit.xml

      - name: Write job summary
        if: always()
        run: |
          php -r "
            \$xml = simplexml_load_file('junit-unit.xml');
            \$suite = \$xml->testsuite;
            \$tests = (int)\$suite['tests'];
            \$failures = (int)\$suite['failures'];
            \$errors = (int)\$suite['errors'];
            \$skipped = (int)(\$suite['skipped'] ?? 0);
            \$passed = \$tests - \$failures - \$errors - \$skipped;
            \$status = (\$failures + \$errors) === 0 ? '✅ Passed' : '❌ Failed';
            \$time = round((float)\$suite['time'], 2);
            \$lines = [
              '## Unit test results — PHP \${{ matrix.php }}, SW \${{ matrix.shopware-version }}',
              '',
              '| | |',
              '|---|---|',
              '| Result | ' . \$status . ' |',
              '| Tests | ' . \$tests . ' |',
              '| Passed | ' . \$passed . ' |',
              '| Failures | ' . \$failures . ' |',
              '| Errors | ' . \$errors . ' |',
              '| Skipped | ' . \$skipped . ' |',
              '| Time | ' . \$time . ' s |',
              '',
            ];
            file_put_contents(getenv('GITHUB_STEP_SUMMARY'), implode(\"\n\", \$lines), FILE_APPEND);
          "

  integration:
    needs: static
    name: Integration tests (PHP ${{ matrix.php }}, SW ${{ matrix.shopware-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            shopware-version: '6.5.8.19'
          - php: '8.3'
            shopware-version: '6.5.8.19'
          - php: '8.2'
            shopware-version: '6.6.10.21'
          - php: '8.3'
            shopware-version: '6.6.10.21'
          - php: '8.4'
            shopware-version: '6.6.10.21'

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: 'v${{ matrix.shopware-version }}'
          php-version: ${{ matrix.php }}
          env: test
          php-extensions: pcov
          install: true

      - name: Checkout Tweakwise module
        uses: actions/checkout@v7
        with:
          path: custom/plugins/RhaeTweakwise

      - name: Install Shopware 6 Tweakwise module
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer config repositories.tweakwise.shopware6 "path" "custom/plugins/RhaeTweakwise"
          composer config allow-plugins.php-http/discovery false
          composer config minimum-stability dev
          composer require richardhaeser/sw-tweakwise --no-audit
          bin/console plugin:refresh
          bin/console plugin:install -c -a RhaeTweakwise

      - name: Restore a real private filesystem root for the test environment
        run: |
          mkdir -p config/packages/test
          cat > config/packages/test/zz_rhae_tweakwise_filesystem.yaml <<'YAML'
          shopware:
              filesystem:
                  private:
                      type: "local"
                      config:
                          root: "%kernel.project_dir%/files"
          YAML
          rm -rf var/cache/*
          APP_ENV=test bin/console cache:clear --env=test

      - name: Run integration tests
        run: |
          cd custom/plugins/RhaeTweakwise/
          php -d pcov.enabled=1 ../../../vendor/bin/phpunit --configuration phpunit.integration.xml --log-junit junit-integration.xml

      - name: Write job summary
        if: always()
        run: |
          php -r "
            \$file = 'custom/plugins/RhaeTweakwise/junit-integration.xml';
            \$xml = simplexml_load_file(\$file);
            \$suite = \$xml->testsuite;
            \$tests = (int)\$suite['tests'];
            \$failures = (int)\$suite['failures'];
            \$errors = (int)\$suite['errors'];
            \$skipped = (int)(\$suite['skipped'] ?? 0);
            \$passed = \$tests - \$failures - \$errors - \$skipped;
            \$status = (\$failures + \$errors) === 0 ? '✅ Passed' : '❌ Failed';
            \$time = round((float)\$suite['time'], 2);
            \$lines = [
              '## Integration test results — PHP \${{ matrix.php }}, SW \${{ matrix.shopware-version }}',
              '',
              '| | |',
              '|---|---|',
              '| Result | ' . \$status . ' |',
              '| Tests | ' . \$tests . ' |',
              '| Passed | ' . \$passed . ' |',
              '| Failures | ' . \$failures . ' |',
              '| Errors | ' . \$errors . ' |',
              '| Skipped | ' . \$skipped . ' |',
              '| Time | ' . \$time . ' s |',
              '',
            ];
            file_put_contents(getenv('GITHUB_STEP_SUMMARY'), implode(\"\n\", \$lines), FILE_APPEND);
          "
